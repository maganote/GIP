<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      color: #2c2c2c;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 32px;
      font-style: italic;
    }

    button {
      background: #3a6ea5;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) { background: #2d5585; }
    button:disabled { background: #9ab3cc; cursor: not-allowed; }

    #status {
      margin-top: 16px;
      color: #888;
      font-style: italic;
      min-height: 24px;
    }

    #article-container {
      margin-top: 40px;
      max-width: 720px;
      width: 100%;
      background: white;
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: none;
    }

    #article-container.visible { display: block; }

    #article-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    #article-body {
      color: #333;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    #article-body p { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Article Generator</h1>
  <p class="subtitle">Powered by Claude AI</p>

  <button id="generate-btn" onclick="generateArticle()">Generate Article</button>
  <div id="status"></div>

  <div id="article-container">
    <div id="article-title"></div>
    <div id="article-body"></div>
  </div>

  <script>
    async function generateArticle() {
      const btn = document.getElementById('generate-btn');
      const status = document.getElementById('status');
      const container = document.getElementById('article-container');

      btn.disabled = true;
      status.textContent = 'Generating article…';

      try {
        const res = await fetch('/generate', { method: 'POST' });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();

        const lines = data.article.split('\n');
        const titleLine = lines.find(l => l.startsWith('# ')) || '';
        const title = titleLine.replace(/^# /, '').trim();
        const body = lines.filter(l => !l.startsWith('# ')).join('\n').trim();

        document.getElementById('article-title').textContent = title || 'Article';
        document.getElementById('article-body').innerHTML =
          body.split(/\n\n+/).map(p => `<p>${p.trim()}</p>`).join('');

        container.classList.add('visible');
        status.textContent = '';
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
